# Repo-local tool configuration ONLY. This product declares NO package: per
# conventions/no-internal-packages.md a package means a separate repo with a valid PyPI project.
# ProspectMap, the offline pipeline package `pipeline` (ADR-0057 product-repo archetype).
# The default lane is numpy-only (instantly installable); the heavy learned lane (torch -> ONNX) is pinned in
# data-pipeline/requirements-precompute.txt and documented in docs/frameworks/03_torch-onnx.md.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# single-letter math notation (loop indices, contingency counts) is intentional domain notation, not ambiguous.
ignore = ["E741"]
